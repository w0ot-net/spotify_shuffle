<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#8a5cff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#5f6cf2" stop-opacity="0.8"/>
      <stop offset="0.85" stop-color="#9a6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c98a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6ce6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#3f6ce6" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#6a7bf0" stop-opacity="0.7"/>
      <stop offset="0.88" stop-color="#4f8cff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3350c8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3350c8" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#6a56d6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6a56d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.1" stop-color="#c6a6ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#c6a6ff" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#b7b0ff" stop-opacity="0.5"/>
      <stop offset="0.95" stop-color="#e0b0a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.12" stop-color="#8fb8ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8fb8ff" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#a6c4ff" stop-opacity="0.4"/>
      <stop offset="0.98" stop-color="#a6c4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <radialGradient id="lift" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#241a44" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#070610" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#070610"/>
  <rect width="1600" height="1000" fill="url(#lift)"/>

  <!-- Silky ribbon bodies: wide, blurred, sweeping curves. -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <path d="M -140 300 C 360 170, 980 270, 1780 180" stroke="url(#violet)" stroke-width="150"/>
    <path d="M -140 560 C 320 660, 1080 460, 1780 540" stroke="url(#blue)" stroke-width="128"/>
    <path d="M -140 800 C 420 880, 1000 720, 1780 820" stroke="url(#deep)" stroke-width="96"/>
  </g>

  <!-- Bright thin cores: the sharp detail the glass frosts. -->
  <g fill="none" stroke-linecap="round">
    <path d="M -140 300 C 360 170, 980 270, 1780 180" stroke="url(#coreV)" stroke-width="2.4"/>
    <path d="M -140 560 C 320 660, 1080 460, 1780 540" stroke="url(#coreB)" stroke-width="2.2"/>
    <path d="M -140 800 C 420 880, 1000 720, 1780 820" stroke="url(#coreB)" stroke-width="1.6" opacity="0.6"/>
  </g>
</svg>
