<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrueShuffle</title>
</head>
<body>
  <main>
    <h1>TrueShuffle</h1>
    <p id="status" role="status" aria-live="polite">Checking Spotify connection...</p>
    <button id="connect" type="button" hidden>Connect Spotify</button>
    <button id="logout" type="button" hidden>Disconnect this browser</button>
    <p id="playlist-status" role="status" aria-live="polite" hidden></p>
    <p id="track-status" role="status" aria-live="polite" hidden></p>
    <progress id="track-progress" hidden></progress>
    <ul id="playlists" hidden></ul>
    <p id="liked-status" role="status" aria-live="polite" hidden></p>
    <button id="liked-connect" type="button" hidden>Reconnect Spotify to enable Liked Songs</button>
    <button id="liked-load" type="button" hidden>Load Liked Songs</button>
    <noscript>JavaScript is required to connect Spotify.</noscript>
  </main>
  <script src="/pure.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
