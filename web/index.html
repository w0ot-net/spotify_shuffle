<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrueShuffle</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-green"></span>
    <span class="blob blob-teal"></span>
    <span class="blob blob-blue"></span>
    <span class="blob blob-violet"></span>
  </div>
  <main class="app">
    <header class="masthead">
      <pre class="banner" aria-hidden="true">[ ][ ][ ][ ]
 ][ ][ ][ ][
[ ][ ][ ][ ]</pre>
      <h1>TrueShuffle</h1>
      <p class="tagline">Actually-random shuffles &mdash; no clustering, no favorites.</p>
    </header>
    <section class="panel connection">
      <p id="status" role="status" aria-live="polite">Checking Spotify connection...</p>
      <div class="actions">
        <button id="connect" type="button" hidden>Connect Spotify</button>
        <button id="logout" type="button" hidden>Disconnect this browser</button>
      </div>
    </section>
    <section class="panel workspace">
      <p id="playlist-status" role="status" aria-live="polite" hidden></p>
      <p id="track-status" role="status" aria-live="polite" hidden></p>
      <progress id="track-progress" hidden></progress>
      <p id="wait-status" hidden></p>
      <button id="cancel" type="button" hidden>Cancel</button>
      <ul id="playlists" hidden></ul>
    </section>
    <noscript class="noscript">JavaScript is required to connect Spotify.</noscript>
  </main>
  <script src="/pure.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
